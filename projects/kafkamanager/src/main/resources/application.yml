spring:
  profiles:
    active: dev

server:
  port: 8080
#  port: 88888
  servlet:
    context-path: /
  tomcat:
    remote-ip-header: x-forward-for
    uri-encoding: UTF-8
    max-threads: 1000
    max-http-header-size: 8096

#日志配置
logging:
  config: classpath:logback-spring.xml


management:
  endpoints:
    web:
      exposure:
        include:
          - 'metrics'
          - 'health'
          - 'env'
    enabled-by-default: on
  server:
    port: 8082
