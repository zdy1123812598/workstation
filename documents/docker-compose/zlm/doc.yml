# 在线部署手册 https://docs.qq.com/doc/DSk5RanNoZXJKeXdH?no_promotion=1

#导出镜像
docker save -o zlmediakit.tar zlmediakit/zlmediakit:master

docker save -o wvp.tar docker-compose-wvp:latest

docker save -o quzheng.tar quzheng:latest


#导入镜像
docker load < zlmediakit.tar

docker load < wvp.tar

docker load < quzheng.tar


#启动
docker-compose -f 'docker-compose-zlmediakit.yml' up -d --build

docker-compose -f 'docker-compose-wvp.yml' up -d --build

docker-compose -f 'docker-compose-quzheng.yml' up -d --build


#移除镜像
docker-compose -f 'docker-compose-zlmediakit.yml' down

docker-compose -f 'docker-compose-wvp.yml' down

docker-compose -f 'docker-compose-quzheng.yml' down

